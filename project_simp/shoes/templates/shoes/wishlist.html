{% extends "layout.html" %}
{% load static %}

{% block title %}Your Wishlist | SIMP{% endblock %}

{% block content %}
<div class="cart-page wishlist-page">
  <div id="wishlist-root">
    <div class="cart-loading">Loading your wishlist…</div>
  </div>

  <!-- View Details modal (same pattern as cart.html) -->
  <div id="wishlist-details-modal" class="modal-overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="wishlist-details-title">
      <button type="button" class="modal-close" id="wishlist-details-close" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="wishlist-details-content"><!-- filled by JS --></div>
    </div>
  </div>
</div>
{% endblock %}

{% block script %}
{{ block.super }}
<script>
  window.WISHLIST_ENDPOINTS = {
    list: "{% url 'shoes:wishlist_item_list' %}",
    add: "{% url 'shoes:wishlist_add' %}",
    remove: "{% url 'shoes:wishlist_remove' %}",
    toggle: "{% url 'shoes:wishlist_toggle' %}",
    moveToCart: "{% url 'shoes:wishlist_move_to_cart' %}",
  };

  function renderWishlistItem(item) {
    const isCustom = item.customization && item.customization.length > 0;
    const meta = isCustom
      ? (item.meta || "")
      : [item.color, item.size].filter(Boolean).join(" &nbsp;•&nbsp; Size: ");

    return `
      <div class="cart-item wishlist-item" data-item-id="${item.id}">
        <img src="${item.photo}" alt="${item.name}">

        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          ${meta ? `<div class="cart-item-meta">${isCustom ? meta : "Size: " + meta}</div>` : ""}
          <button type="button" class="cart-view-details wishlist-view-details" data-item-id="${item.id}">View Details</button>
        </div>

        <div class="cart-item-actions">
          <div class="cart-item-unit-price">${Cart.formatCurrency(item.price)}</div>
          <button type="button" class="btn-checkout wishlist-move-btn">
            <i class="fa-solid fa-cart-plus"></i> Move to Cart
          </button>
          <button type="button" class="cart-remove-btn wishlist-remove-btn">
            <i class="fa-solid fa-trash"></i> Remove
          </button>
        </div>
      </div>`;
  }

  /* ---------- View Details modal ---------- */

  function renderWishlistDetailsModal(item) {
    const isCustom = item.customization && item.customization.length > 0;

    const partsHtml = isCustom ? `
      <div class="details-parts">
        <h3>Customization</h3>
        <ul class="details-parts-list">
          ${item.customization.map(part => `
            <li>
              <span class="part-dot${part.outline ? " part-dot--outline" : ""}" style="background:${part.color}"></span>
              <span class="details-part-label">${part.label}</span>
            </li>
          `).join("")}
        </ul>
      </div>` : "";

    const attrsHtml = !isCustom ? `
      <div class="details-attrs">
        ${item.color ? `<div><span>Color</span><strong>${item.color}</strong></div>` : ""}
        ${item.size ? `<div><span>Size</span><strong>${item.size}</strong></div>` : ""}
      </div>` : "";

    return `
      <img class="details-photo" src="${item.photo}" alt="${item.name}">
      <div class="details-body">
        <h2 id="wishlist-details-title">${item.name}</h2>
        ${item.meta ? `<div class="details-meta">${item.meta}</div>` : ""}
        ${attrsHtml}
        ${partsHtml}

        <div class="details-price-rows">
          <div class="details-price-total"><span>Price</span><span>${Cart.formatCurrency(item.price)}</span></div>
        </div>

        ${item.stock ? `<div class="details-stock"><i class="fa-solid fa-circle-check"></i> ${item.stock} in stock</div>` : ""}
      </div>`;
  }

  function openWishlistDetails(itemId) {
    const item = (Wishlist.getCached().items || []).find(i => i.id === itemId);
    if (!item) return;
    document.querySelector("#wishlist-details-content").innerHTML = renderWishlistDetailsModal(item);
    const overlay = document.querySelector("#wishlist-details-modal");
    overlay.hidden = false;
    requestAnimationFrame(() => overlay.classList.add("modal-overlay--show"));
  }

  function closeWishlistDetails() {
    const overlay = document.querySelector("#wishlist-details-modal");
    overlay.classList.remove("modal-overlay--show");
    setTimeout(() => { overlay.hidden = true; }, 150);
  }

  function initWishlistDetailsModal() {
    const overlay = document.querySelector("#wishlist-details-modal");
    document.querySelector("#wishlist-details-close").addEventListener("click", closeWishlistDetails);
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeWishlistDetails();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !overlay.hidden) closeWishlistDetails();
    });
  }

  function renderWishlistPage(wishlistData) {
    const root = document.querySelector("#wishlist-root");
    const items = wishlistData.items || [];

    if (items.length === 0) {
      root.innerHTML = `
        <div class="cart-header">
          <h1>Your Wishlist</h1>
        </div>
        <div class="cart-empty">
          <i class="fa-solid fa-heart"></i>
          <p>Your wishlist is empty.</p>
          <a href="{% url 'shoes:shoes_list' %}">Continue shopping</a>
        </div>`;
      return;
    }

    const count = wishlistData.count;

    root.innerHTML = `
      <div class="cart-header">
        <div>
          <h1>Your Wishlist</h1>
          <div class="cart-item-count">${count} item${count === 1 ? "" : "s"}</div>
        </div>
        <a class="btn-continue" href="{% url 'shoes:shoes_list' %}">
          <i class="fa-solid fa-arrow-left"></i> Continue Shopping
        </a>
      </div>

      <div class="cart-items">
        ${items.map(renderWishlistItem).join("")}
      </div>`;

    root.querySelectorAll(".wishlist-item").forEach(row => {
      const itemId = parseInt(row.dataset.itemId, 10);

      row.querySelector(".wishlist-remove-btn").addEventListener("click", () => {
        Wishlist.removeItem(itemId).catch(err => Wishlist.toast(err.message));
      });
      row.querySelector(".wishlist-move-btn").addEventListener("click", async () => {
        try {
          await Wishlist.moveToCart(itemId);
          Wishlist.toast("Moved to cart");
        } catch (err) {
          Wishlist.toast(err.message || "Couldn't move that to your cart.");
        }
      });
      row.querySelector(".wishlist-view-details").addEventListener("click", () => {
        openWishlistDetails(itemId);
      });
    });
  }

  document.addEventListener("DOMContentLoaded", async () => {
    initWishlistDetailsModal();
    const wishlistData = await Wishlist.refresh();
    renderWishlistPage(wishlistData);
  });

  window.addEventListener("wishlist:updated", (e) => renderWishlistPage(e.detail));
</script>
{% endblock %}
