<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | SIMP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/static/css/navbar.css">
  <link rel="stylesheet" href="/static/css/cart.css">
  <style>
    .checkout-page { max-width: 1000px; margin: 30px auto; padding: 0 16px; }
    .checkout-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; align-items: start; }
    @media (max-width: 800px) { .checkout-layout { grid-template-columns: 1fr; } }

    .checkout-section { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .checkout-section h2 { font-size: 18px; margin-bottom: 14px; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-row.full { grid-template-columns: 1fr; }
    .form-row label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
    .form-row input, .form-row textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
    }

    .payment-options { display: flex; flex-direction: column; gap: 10px; }
    .payment-option {
      display: flex; align-items: center; gap: 12px; border: 1px solid #ddd; border-radius: 8px;
      padding: 12px 14px; cursor: pointer; transition: border-color .15s;
    }
    .payment-option:has(input:checked) { border-color: #111; background: #fafafa; }
    .payment-option img { height: 28px; }
    .payment-option .pname { font-weight: 600; font-size: 14px; }
    .payment-option .psub { font-size: 12px; color: #777; }

    .cart-summary { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 20px; position: sticky; top: 20px; }
    .cart-summary h2 { font-size: 18px; margin-bottom: 14px; }
    .checkout-mini-item { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: #444; }
    .cart-summary-row { display: flex; justify-content: space-between; font-size: 14px; margin: 8px 0; color: #555; }
    .cart-summary-total { display: flex; justify-content: space-between; font-weight: 700; font-size: 16px; margin-top: 12px; border-top: 1px solid #eee; padding-top: 12px; }

    .btn-place-order {
      width: 100%; margin-top: 16px; padding: 13px; border: none; border-radius: 8px;
      background: #111; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .btn-place-order:disabled { background: #999; cursor: not-allowed; }
    .checkout-error { color: #c0392b; font-size: 13px; margin-top: 8px; display: none; }
  </style>
</head>
<body>

  <!-- Reuse your existing navbar include here -->

  <div class="checkout-page">
    <h1>Checkout</h1>

    <div class="checkout-layout">
      <div>
        <div class="checkout-section">
          <h2>Shipping Address</h2>
          <form id="address-form">
            {% csrf_token %}
            <div class="form-row">
              <div>
                <label>Full Name</label>
                <input type="text" name="full_name" required>
              </div>
              <div>
                <label>Phone Number</label>
                <input type="tel" name="phone" required>
              </div>
            </div>
            <div class="form-row full">
              <div>
                <label>Street Address</label>
                <input type="text" name="address" required>
              </div>
            </div>
            <div class="form-row">
              <div>
                <label>City</label>
                <input type="text" name="city" required>
              </div>
              <div>
                <label>Landmark (optional)</label>
                <input type="text" name="landmark">
              </div>
            </div>
          </form>
        </div>

        <div class="checkout-section">
          <h2>Payment Method</h2>
          <div class="payment-options">
            <label class="payment-option">
              <input type="radio" name="payment_method" value="esewa" checked>
              <img src="/static/images/esewa-logo.png" alt="eSewa" onerror="this.style.display='none'">
              <div>
                <div class="pname">eSewa</div>
                <div class="psub">Pay securely using your eSewa wallet</div>
              </div>
            </label>
            <label class="payment-option">
              <input type="radio" name="payment_method" value="khalti">
              <img src="/static/images/khalti-logo.png" alt="Khalti" onerror="this.style.display='none'">
              <div>
                <div class="pname">Khalti</div>
                <div class="psub">Pay securely using your Khalti wallet</div>
              </div>
            </label>
          </div>
        </div>
      </div>

      <div class="cart-summary">
        <h2>Order Summary</h2>
        <div id="checkout-items"></div>
        <div class="cart-summary-row">
          <span>Subtotal</span>
          <span id="checkout-subtotal">NPR.0</span>
        </div>
        <div class="cart-summary-row">
          <span>Shipping</span>
          <span>NPR.0</span>
        </div>
        <div class="cart-summary-total">
          <span>Total</span>
          <span id="checkout-total">NPR.0</span>
        </div>
        <button class="btn-place-order" id="place-order-btn">Place Order</button>
        <div class="checkout-error" id="checkout-error">Please fill all required fields.</div>
      </div>
    </div>
  </div>

  <script src="/static/js/cart.js"></script>
  <script>
    function formatCurrency(n) {
      return "NPR." + n.toFixed(2).replace(/\.00$/, "");
    }

    function renderSummary() {
      const items = Cart.getItems();
      const itemsHtml = items.map(item => `
        <div class="checkout-mini-item">
          <span>${item.name} (${item.color}, ${item.size}) x${item.quantity}</span>
          <span>${formatCurrency(item.price * item.quantity)}</span>
        </div>
      `).join("");
      document.querySelector("#checkout-items").innerHTML = itemsHtml;

      const subtotal = Cart.getSubtotal();
      document.querySelector("#checkout-subtotal").textContent = formatCurrency(subtotal);
      document.querySelector("#checkout-total").textContent = formatCurrency(subtotal);
    }

    document.addEventListener("DOMContentLoaded", renderSummary);

    document.querySelector("#place-order-btn").addEventListener("click", async () => {
      const form = document.querySelector("#address-form");
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const formData = Object.fromEntries(new FormData(form).entries());
      delete formData.csrfmiddlewaretoken; // not part of the address payload

      const paymentMethod = document.querySelector('input[name="payment_method"]:checked').value;
      const items = Cart.getItems().map(i => ({ variant_id: i.variant_id, quantity: i.quantity }));

      const btn = document.querySelector("#place-order-btn");
      const errEl = document.querySelector("#checkout-error");
      errEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Placing order...";

      try {
        const csrftoken = document.cookie.match(/csrftoken=([^;]+)/)?.[1] || "";

        const res = await fetch("/shoes/orders/create/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrftoken,
          },
          body: JSON.stringify({
            address: formData,
            items: items,
            payment_method: paymentMethod,
          }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "Could not place order. Please try again.");
        }

        Cart.clear();

        window.location.href = paymentMethod === "esewa"
          ? `/shoes/payments/esewa/initiate/${data.order_id}/`
          : `/shoes/payments/khalti/initiate/${data.order_id}/`;

      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Place Order";
      }
    });
  </script>
</body>
</html>
